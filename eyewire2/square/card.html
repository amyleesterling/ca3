<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../fonts/inter-latin.woff2) format("woff2")}
html,body{margin:0;background:#03050f}
.card{position:relative;width:1080px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;width:1080px;height:1080px}
.scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(3,5,15,.92) 0%,rgba(3,5,15,.55) 22%,rgba(3,5,15,0) 34%,rgba(3,5,15,0) 66%,rgba(3,5,15,.6) 76%,rgba(3,5,15,.95) 100%),
  radial-gradient(ellipse at 50% 50%,rgba(3,5,15,0) 55%,rgba(3,5,15,.55) 100%)}
.top{position:absolute;left:0;right:0;top:64px;text-align:center}
.eyebrow{font-size:25px;letter-spacing:.44em;text-transform:uppercase;font-weight:500;color:rgba(255,255,255,.7);padding-left:.44em}
.num{font-size:196px;font-weight:300;letter-spacing:-.04em;line-height:1;margin-top:18px;color:#ffd56a;font-variant-numeric:tabular-nums;
  text-shadow:0 0 60px rgba(255,200,90,.55),0 0 140px rgba(255,180,60,.3),0 4px 30px rgba(3,5,15,.8)}
.bottom{position:absolute;left:0;right:0;bottom:92px;text-align:center}
.l1{font-size:62px;font-weight:300;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(3,5,15,.9)}
.l2{font-size:30px;font-weight:400;color:rgba(255,255,255,.78);margin-top:14px}
.wm{position:absolute;right:40px;bottom:30px;font-size:22px;font-weight:500;color:rgba(255,255,255,.5)}
</style>
<div class="card">
  <img class="bg" src="plate_26_square.png">
  <div class="scrim"></div>
  <div class="top"><div class="eyebrow">Eyewire II</div><div class="num">10,000</div></div>
  <div class="bottom"><div class="l1">cells mapped</div><div class="l2">by citizen scientists. Thank you!</div></div>
  <div class="wm">eyewire.ai</div>
</div>
